# Cloud Build pipeline for the live-ingest service.
# Triggered manually with:
#   gcloud builds submit cloud-run/live-ingest \
#       --config cloud-run/live-ingest/cloudbuild.yaml \
#   Submit path becomes the Docker context; use `.` below (not cloud-run/live-ingest).
#       --substitutions _REGION=europe-central2,_SF_INGEST_URL=https://yourorg.my.salesforce.com
substitutions:
  _SERVICE: live-ingest
  _AR_REGION: europe-central2
  _REGION: europe-central2
  _SA: live-ingest
  # Data Cloud Ingestion API base URL (no trailing slash), e.g. https://yourorg.my.salesforce.com
  _SF_INGEST_URL: ""

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_SERVICE/$_SERVICE:$BUILD_ID
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_SERVICE/$_SERVICE:$BUILD_ID

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy $_SERVICE \
          --image $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_SERVICE/$_SERVICE:$BUILD_ID \
          --region $_REGION \
          --service-account $_SA@$PROJECT_ID.iam.gserviceaccount.com \
          --no-allow-unauthenticated \
          --set-env-vars BQ_DATASET_RAW=sf_fan360_raw,BQ_LOCATION=EU,GCP_PROJECT_ID=$PROJECT_ID,SF_INGEST_URL=$_SF_INGEST_URL \
          --set-secrets API_FOOTBALL_KEY=api-football-key:latest,FOOTBALL_DATA_API_KEY=football-data-key:latest,SF_INGEST_CLIENT_ID=sf-ingest-client-id:latest,SF_INGEST_PRIVATE_KEY=sf-ingest-private-key:latest,SF_INGEST_USERNAME=sf-ingest-username:latest \
          --cpu 1 --memory 512Mi --concurrency 40 --timeout 60s \
          --min-instances 0 --max-instances 3

images:
  - $_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_SERVICE/$_SERVICE:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
