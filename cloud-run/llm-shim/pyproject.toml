[project]
name = "fan360-labs-llm-shim"
version = "0.1.0"
description = "Cloud Run shim: Vertex AI Gemini request shape -> free Gemini AI Studio API. Plus /rag/search for the agent's vector RAG action."
requires-python = ">=3.11,<3.14"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "cachetools>=5.5",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
